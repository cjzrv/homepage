<section class="article-section"><h2>概述</h2>
<p>linecover 是《高效的 PCB 銅面覆蓋法》研究的 C++ 命令列實作，可用於比較多邊形覆蓋演算法。</p>
</section>

<section class="article-section"><h2>功能</h2>
<ul><li>支援三角形與四邊形的載入及隨機生成。</li>
<li>可執行不同覆蓋方法及對照測試。</li>
<li>具有快速執行及圖形資料儲存等參數。</li>
</ul>
<p>論文及實驗數據： <a href="/zh-tw/research/pcb-coverage/">高效的 PCB 銅面覆蓋法</a>.</p>
</section>
